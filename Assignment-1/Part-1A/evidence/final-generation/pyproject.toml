[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-scorer"
version = "0.1.0"
description = "Deterministic General Investor Score (GIS) scorer"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gis-scorer = "gis_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gis_scorer"]
branch = true

[tool.coverage.report]
show_missing = true
